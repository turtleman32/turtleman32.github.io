<!DOCTYPE html>
<html lang="en">
<head>
  <title>The Annual Classic</title>
  <style>
    body {
      background-color: #1a3a2a;
      color: white;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      color: #c9a84c;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
    }

    .champions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background-color: #2d5a3d;
      border: 2px solid #c9a84c;
      border-radius: 10px;
      padding: 20px;
      width: 200px;
    }

    .card h2 {
      color: #c9a84c;
      font-size: 1rem;
    }

    .card p {
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>

  <h1>⛳ The Annual Classic</h1>
  <p>Golf & Washers Championship</p>

  <div class="champions">

    <div class="card">
      <h2>Golf Champion</h2>
      <p>Your Name</p>
    </div>

    <div class="card">
      <h2>Washers Singles</h2>
      <p>Your Name</p>
    </div>

    <div class="card">
      <h2>Washers Doubles</h2>
      <p>Your Name</p>
    </div>

  </div>

</body>
</html>
